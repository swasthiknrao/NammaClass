name: nammaclass
description: "NammaClass — Smart School ERP Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing & State
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  badges: ^3.1.2
  pin_code_fields: ^8.0.0
  table_calendar: ^3.1.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0

  # Utils
  intl: ^0.20.2
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2

  # Networking & local persistence (clean-arch / sync layer)
  dio: ^5.7.0
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  jwt_decoder: ^2.0.1
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
    - assets/data/
    - assets/data/mock_bundle.json
